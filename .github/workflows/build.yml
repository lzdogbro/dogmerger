name: build

# Tauri 只支持在目标系统上构建，所以 macOS / Windows / Linux 的安装包必须由
# 各自的 runner 产出。打 v* tag 时会额外创建 GitHub Release 并挂上全部产物。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: ''
          - name: Windows x64
            platform: windows-latest
            args: ''
          - name: Linux x86_64
            platform: ubuntu-22.04
            args: '--bundles deb'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      - name: Package portable build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $out = "Dogmerger_${version}_x64-portable.zip"
          # 便携版必须带上 sidecar，否则单独一个 exe 用不了内置 ffmpeg
          Compress-Archive -Path `
            desktop/src-tauri/target/release/dogmerger.exe, `
            desktop/src-tauri/target/release/ffmpeg.exe, `
            desktop/src-tauri/target/release/ffprobe.exe `
            -DestinationPath $out -Force
          Write-Host "created $out"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dogmerger-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            Dogmerger_*_portable.zip
          if-no-files-found: warn

  release:
    name: Publish release
    # 任一平台排队超时被取消时，仍把已产出的包发布出去；后续可再补传
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: find dist -type f | sort

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # 先建空 release 再逐个上传，缺某个包类型也不会整体失败
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Dogmerger $TAG" \
              --notes-file .github/release-notes.md \
              --verify-tag
          fi
          find dist -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.msi' -o -name '*.exe' -o -name '*.zip' \) \
            -print -exec gh release upload "$TAG" {} --clobber \;
          echo "--- 已上传 ---"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
